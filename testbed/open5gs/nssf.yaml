logger: {file: {path: /var/log/open5gs/nssf.log}}
global: {max: {ue: 1024}}
nssf:
  sbi:
    server: [{address: 10.33.0.17, port: 7777}]
    client:
      scp: [{uri: http://10.33.0.11:7777}]
      nsi:
        # Three network slice instances -> all served by the same NRF here; in production each maps to its own NRF/AMF set.
        - {uri: http://10.33.0.10:7777, s_nssai: {sst: 2, sd: "000001"}}   # control (URLLC)
        - {uri: http://10.33.0.10:7777, s_nssai: {sst: 1, sd: "000002"}}   # vision (eMBB)
        - {uri: http://10.33.0.10:7777, s_nssai: {sst: 3, sd: "000003"}}   # telemetry (MIoT)

logger: {file: {path: /var/log/open5gs/pcf.log}}
global: {max: {ue: 1024}}
pcf:
  sbi:
    server: [{address: 10.33.0.15, port: 7777}]
    client: {scp: [{uri: http://10.33.0.11:7777}]}
  metrics: {server: [{address: 10.33.0.15, port: 9090}]}
  # Per-slice/DNN session policy: default 5QI/ARP per DNN and dedicated PCC rules (brief §5.3).
  # Values mirror config/qos.yaml — keep them in sync. Open5GS ARP enums: pre_emption_capability 1=ENABLED(may pre-empt)
  # 2=DISABLED; pre_emption_vulnerability 1=ENABLED(preemptable) 2=DISABLED — verify in lib/core/ogs-3gpp-types.h.
  policy:
    - plmn_id: {mcc: 999, mnc: 70}
      slice:
        - sst: 2
          sd: "000001"
          default_indicator: false
          session:
            - name: control.port5g
              type: 3          # IPv4
              ambr: {downlink: {value: 5, unit: 2}, uplink: {value: 5, unit: 2}}   # unit 2 = Mbps
              qos:
                index: 82
                arp: {priority_level: 1, pre_emption_capability: 1, pre_emption_vulnerability: 2}
        - sst: 1
          sd: "000002"
          default_indicator: true
          session:
            - name: vision.port5g
              type: 3
              ambr: {downlink: {value: 100, unit: 2}, uplink: {value: 100, unit: 2}}
              qos:
                index: 9
                arp: {priority_level: 6, pre_emption_capability: 1, pre_emption_vulnerability: 1}
              pcc_rule:
                - qos:
                    index: 84
                    arp: {priority_level: 6, pre_emption_capability: 1, pre_emption_vulnerability: 1}
                    gbr: {downlink: {value: 1, unit: 2}, uplink: {value: 20, unit: 2}}
                    mbr: {downlink: {value: 2, unit: 2}, uplink: {value: 30, unit: 2}}
                  flow:
                    - {direction: 1, description: "permit out ip from any to assigned"}   # 1 = downlink
                    - {direction: 2, description: "permit out ip from any to assigned"}   # 2 = uplink
        - sst: 3
          sd: "000003"
          default_indicator: false
          session:
            - name: iot.port5g
              type: 3
              ambr: {downlink: {value: 2, unit: 2}, uplink: {value: 2, unit: 2}}
              qos:
                index: 9
                arp: {priority_level: 12, pre_emption_capability: 2, pre_emption_vulnerability: 1}

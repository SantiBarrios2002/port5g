logger: {file: {path: /var/log/open5gs/smf.log}}
global: {max: {ue: 1024}}
smf:
  sbi:
    server: [{address: 10.33.0.21, port: 7777}]
    client: {scp: [{uri: http://10.33.0.11:7777}]}
  pfcp:
    server: [{address: 10.33.0.21}]
    client:
      upf:
        # UPF selection by DNN: one UPF per slice (brief §5.2). Each carries its own UE pool.
        - {address: 10.33.0.31, dnn: [control.port5g]}
        - {address: 10.33.0.32, dnn: [vision.port5g]}
        - {address: 10.33.0.33, dnn: [iot.port5g]}
  gtpc: {server: [{address: 10.33.0.21}]}
  gtpu: {server: [{address: 10.33.0.21}]}
  metrics: {server: [{address: 10.33.0.21, port: 9090}]}
  session:
    - {subnet: 10.45.1.0/24, gateway: 10.45.1.1, dnn: control.port5g}
    - {subnet: 10.45.2.0/24, gateway: 10.45.2.1, dnn: vision.port5g}
    - {subnet: 10.45.3.0/24, gateway: 10.45.3.1, dnn: iot.port5g}
  dns: [8.8.8.8]
  mtu: 1400
  info:
    - s_nssai:
        - {sst: 2, sd: "000001", dnn: [control.port5g]}
        - {sst: 1, sd: "000002", dnn: [vision.port5g]}
        - {sst: 3, sd: "000003", dnn: [iot.port5g]}
      tai: [{plmn_id: {mcc: 999, mnc: 70}, tac: 1}]

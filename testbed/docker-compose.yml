# port5g testbed — Open5GS 5GC (3 slices, 3 UPFs) + UERANSIM gNB and 3 UE classes.
# Images: Gradiant builds (docker.io/gradiant/open5gs, gradiant/ueransim). PIN THE TAGS after a first successful run
# and record them in testbed/README.md — image drift is the #1 cause of "demo worked yesterday".
x-open5gs: &open5gs
  image: gradiant/open5gs:${OPEN5GS_TAG:-2.7.2}
  networks: [core]
  environment: [DB_URI=mongodb://mongo/open5gs]
  volumes: [./open5gs:/etc/open5gs:ro]
  restart: unless-stopped

services:
  mongo:
    image: mongo:6
    networks: [core]
    volumes: [mongo-data:/data/db]

  nrf:  {<<: *open5gs, command: open5gs-nrfd  -c /etc/open5gs/nrf.yaml,  networks: {core: {ipv4_address: 10.33.0.10}}}
  scp:  {<<: *open5gs, command: open5gs-scpd  -c /etc/open5gs/scp.yaml,  networks: {core: {ipv4_address: 10.33.0.11}}, depends_on: [nrf]}
  ausf: {<<: *open5gs, command: open5gs-ausfd -c /etc/open5gs/ausf.yaml, networks: {core: {ipv4_address: 10.33.0.12}}, depends_on: [scp]}
  udm:  {<<: *open5gs, command: open5gs-udmd  -c /etc/open5gs/udm.yaml,  networks: {core: {ipv4_address: 10.33.0.13}}, depends_on: [scp]}
  udr:  {<<: *open5gs, command: open5gs-udrd  -c /etc/open5gs/udr.yaml,  networks: {core: {ipv4_address: 10.33.0.14}}, depends_on: [scp, mongo]}
  pcf:  {<<: *open5gs, command: open5gs-pcfd  -c /etc/open5gs/pcf.yaml,  networks: {core: {ipv4_address: 10.33.0.15}}, depends_on: [scp, mongo]}
  bsf:  {<<: *open5gs, command: open5gs-bsfd  -c /etc/open5gs/bsf.yaml,  networks: {core: {ipv4_address: 10.33.0.16}}, depends_on: [scp]}
  nssf: {<<: *open5gs, command: open5gs-nssfd -c /etc/open5gs/nssf.yaml, networks: {core: {ipv4_address: 10.33.0.17}}, depends_on: [scp]}
  amf:  {<<: *open5gs, command: open5gs-amfd  -c /etc/open5gs/amf.yaml,  networks: {core: {ipv4_address: 10.33.0.20}}, depends_on: [nssf, ausf, udm]}
  smf:  {<<: *open5gs, command: open5gs-smfd  -c /etc/open5gs/smf.yaml,  networks: {core: {ipv4_address: 10.33.0.21}}, depends_on: [pcf, upf-control, upf-vision, upf-iot]}

  # One UPF per slice (brief §5.2): distinct N3/N4 addresses and DNNs; TUN devices for N6.
  upf-control: {<<: *open5gs, command: open5gs-upfd -c /etc/open5gs/upf-control.yaml, networks: {core: {ipv4_address: 10.33.0.31}}, cap_add: [NET_ADMIN], devices: [/dev/net/tun], sysctls: {net.ipv4.ip_forward: 1}}
  upf-vision:  {<<: *open5gs, command: open5gs-upfd -c /etc/open5gs/upf-vision.yaml,  networks: {core: {ipv4_address: 10.33.0.32}}, cap_add: [NET_ADMIN], devices: [/dev/net/tun], sysctls: {net.ipv4.ip_forward: 1}}
  upf-iot:     {<<: *open5gs, command: open5gs-upfd -c /etc/open5gs/upf-iot.yaml,     networks: {core: {ipv4_address: 10.33.0.33}}, cap_add: [NET_ADMIN], devices: [/dev/net/tun], sysctls: {net.ipv4.ip_forward: 1}}

  gnb:
    image: gradiant/ueransim:${UERANSIM_TAG:-3.2.6}
    command: gnb -c /etc/ueransim/gnb.yaml
    volumes: [./ueransim:/etc/ueransim:ro]
    networks: {core: {ipv4_address: 10.33.0.40}}
    depends_on: [amf]

  ue-crane:   {image: "gradiant/ueransim:${UERANSIM_TAG:-3.2.6}", command: ue -c /etc/ueransim/ue-crane.yaml,   volumes: [./ueransim:/etc/ueransim:ro], networks: [core], cap_add: [NET_ADMIN], devices: [/dev/net/tun], depends_on: [gnb], profiles: [demo]}
  ue-shuttle: {image: "gradiant/ueransim:${UERANSIM_TAG:-3.2.6}", command: ue -c /etc/ueransim/ue-shuttle.yaml, volumes: [./ueransim:/etc/ueransim:ro], networks: [core], cap_add: [NET_ADMIN], devices: [/dev/net/tun], depends_on: [gnb], profiles: [demo]}
  ue-reefer:  {image: "gradiant/ueransim:${UERANSIM_TAG:-3.2.6}", command: ue -c /etc/ueransim/ue-reefer.yaml,  volumes: [./ueransim:/etc/ueransim:ro], networks: [core], cap_add: [NET_ADMIN], devices: [/dev/net/tun], depends_on: [gnb], profiles: [demo]}

  # Capture N2 (NGAP/SCTP) and N4 (PFCP) on the shared bridge for figure 10.
  capture:
    image: nicolaka/netshoot
    network_mode: "service:amf"
    command: sh -c "tcpdump -i any -w /captures/port5g_$(date +%s).pcap 'sctp or udp port 8805 or udp port 2152'"
    volumes: [./captures:/captures]
    profiles: [demo]

networks:
  core:
    ipam: {config: [{subnet: 10.33.0.0/24}]}

volumes:
  mongo-data:

# qos.yaml — slices, 5QIs, ARP, GFBR/MFBR, PDB, PER, MDBV.
# 5QI rows: 3GPP TS 23.501 Table 5.7.4-1. All rows marked 'secondary' MUST be re-checked against the
# current release (Rel-18 text) before the report — rule §10.3. Note in the report where the brief was wrong.

slices:
  control:
    sst: {value: 2, unit: "", source: "TS 23.501 §5.15.2.2 Table 5.15.2.2-1: SST 2 = URLLC", confidence: secondary}
    sd:  {value: "000001", unit: "", source: "Design (operator-defined SD)", confidence: design}
    serves: ["S1_control"]
    dnn: {value: "control.port5g", unit: "", source: "Design", confidence: design}
    ul_capacity_share_min: {value: 0.10, unit: "", source: "Design: guaranteed UL PRB share (never pre-empted)", confidence: design}
    ul_capacity_share_max: {value: 0.30, unit: "", source: "Design: cap so control cannot starve vision", confidence: design}
    isolation_rationale: "Safety-critical; must never be pre-empted"
  vision:
    sst: {value: 1, unit: "", source: "TS 23.501 Table 5.15.2.2-1: SST 1 = eMBB", confidence: secondary}
    sd:  {value: "000002", unit: "", source: "Design", confidence: design}
    serves: ["S1_video", "S2_video", "S2_telemetry"]
    dnn: {value: "vision.port5g", unit: "", source: "Design", confidence: design}
    ul_capacity_share_min: {value: 0.55, unit: "", source: "Design", confidence: design}
    ul_capacity_share_max: {value: 0.85, unit: "", source: "Design", confidence: design}
    isolation_rationale: "High UL volume, tolerant of ~30 ms; alternative of putting crane video in URLLC discussed in report"
  telemetry:
    sst: {value: 3, unit: "", source: "TS 23.501 Table 5.15.2.2-1: SST 3 = MIoT", confidence: secondary}
    sd:  {value: "000003", unit: "", source: "Design", confidence: design}
    serves: ["S3_reefer", "S3_gate", "S3_handheld"]
    dnn: {value: "iot.port5g", unit: "", source: "Design", confidence: design}
    ul_capacity_share_min: {value: 0.05, unit: "", source: "Design: small floor so IoT is never fully starved", confidence: design}
    ul_capacity_share_max: {value: 0.35, unit: "", source: "Design", confidence: design}
    isolation_rationale: "Massive count, best-effort, first to be squeezed"

# Standardised 5QI characteristics (TS 23.501 Table 5.7.4-1). Fields: resource_type, priority_level,
# pdb_ms, per, mdbv_bytes (null = N/A), averaging_window_ms (null = N/A), example_services.
standard_5qi:
  9:
    resource_type: "non-GBR"
    priority_level: {value: 90, unit: "", source: "TS 23.501 Table 5.7.4-1 row 5QI=9", confidence: secondary}
    pdb_ms: {value: 300, unit: ms, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    per: {value: 1.0e-6, unit: "", source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    mdbv_bytes: null
    averaging_window_ms: null
    example_services: "Default bearer, buffered video, TCP-based"
  80:
    resource_type: "non-GBR"
    priority_level: {value: 68, unit: "", source: "TS 23.501 Table 5.7.4-1 row 5QI=80", confidence: secondary}
    pdb_ms: {value: 10, unit: ms, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    per: {value: 1.0e-6, unit: "", source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    mdbv_bytes: null
    averaging_window_ms: null
    example_services: "Low latency eMBB, AR"
  82:
    resource_type: "delay-critical GBR"
    priority_level: {value: 19, unit: "", source: "TS 23.501 Table 5.7.4-1 row 5QI=82", confidence: secondary}
    pdb_ms: {value: 10, unit: ms, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    per: {value: 1.0e-4, unit: "", source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    mdbv_bytes: {value: 255, unit: B, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    averaging_window_ms: {value: 2000, unit: ms, source: "TS 23.501 Table 5.7.4-1 (default averaging window 2000 ms)", confidence: secondary}
    example_services: "Discrete automation (small packets)"
  83:
    resource_type: "delay-critical GBR"
    priority_level: {value: 22, unit: "", source: "TS 23.501 Table 5.7.4-1 row 5QI=83", confidence: secondary}
    pdb_ms: {value: 10, unit: ms, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    per: {value: 1.0e-4, unit: "", source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    mdbv_bytes: {value: 1354, unit: B, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    averaging_window_ms: {value: 2000, unit: ms, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    example_services: "Discrete automation (V2X messages)"
  84:
    resource_type: "delay-critical GBR"
    priority_level: {value: 24, unit: "", source: "TS 23.501 Table 5.7.4-1 row 5QI=84", confidence: secondary}
    pdb_ms: {value: 30, unit: ms, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    per: {value: 1.0e-5, unit: "", source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    mdbv_bytes: {value: 1354, unit: B, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    averaging_window_ms: {value: 2000, unit: ms, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    example_services: "Intelligent transport systems"
  85:
    resource_type: "delay-critical GBR"
    priority_level: {value: 21, unit: "", source: "TS 23.501 Table 5.7.4-1 row 5QI=85", confidence: secondary}
    pdb_ms: {value: 5, unit: ms, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    per: {value: 1.0e-5, unit: "", source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    mdbv_bytes: {value: 255, unit: B, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    averaging_window_ms: {value: 2000, unit: ms, source: "TS 23.501 Table 5.7.4-1", confidence: secondary}
    example_services: "Electricity distribution high voltage, V2X (remote driving)"

# Non-standardised 5QI for crane video: no standard row combines GBR, ~30 ms PDB and 10^-4..10^-6 PER at
# 40 Mbit/s with a large MDBV. PCF signals the full characteristics explicitly (TS 23.501 §5.7.3.2).
custom_5qi:
  crane_video:
    qi_value: {value: 130, unit: "", source: "Design: operator-specific 5QI value in the non-standardised range (TS 23.501 §5.7.2.1: values 128-254 are operator-specific)", confidence: secondary}
    resource_type: "GBR"
    priority_level: {value: 30, unit: "", source: "Design: between 5QI 84 (24) and 5QI 2 (40)", confidence: design}
    pdb_ms: {value: 30, unit: ms, source: "Design: matches S1 video tolerance in brief §3.3", confidence: design}
    per: {value: 1.0e-4, unit: "", source: "Design: video is FEC/concealment tolerant", confidence: design}
    mdbv_bytes: null
    averaging_window_ms: {value: 2000, unit: ms, source: "TS 23.501 default", confidence: secondary}

# QoS flow table: one row per service flow.
flows:
  S1_control:
    slice: control
    qi: 82
    arp: {priority_level: 1, pre_emption_capability: "MAY_PREEMPT", pre_emption_vulnerability: "NOT_PREEMPTABLE"}
    gfbr_ul_mbps: {value: 0.204, unit: Mbit/s, source: "Computed: 100 Hz x 255 B x 8 (services.yaml); rounded for readability", confidence: design}
    mfbr_ul_mbps: {value: 0.5, unit: Mbit/s, source: "Design", confidence: design}
    gfbr_dl_mbps: {value: 0.204, unit: Mbit/s, source: "Computed as UL", confidence: design}
    mfbr_dl_mbps: {value: 0.5, unit: Mbit/s, source: "Design", confidence: design}
    ue_class: crane_cpe
  S1_video:
    slice: vision
    qi: custom:crane_video
    arp: {priority_level: 4, pre_emption_capability: "MAY_PREEMPT", pre_emption_vulnerability: "NOT_PREEMPTABLE"}
    gfbr_ul_mbps: {value: 40, unit: Mbit/s, source: "services.yaml S1 ul_video_rate_per_crane_mbps", confidence: design}
    mfbr_ul_mbps: {value: 60, unit: Mbit/s, source: "services.yaml upper bound", confidence: design}
    gfbr_dl_mbps: {value: 0, unit: Mbit/s, source: "Video is UL-only", confidence: design}
    mfbr_dl_mbps: {value: 1, unit: Mbit/s, source: "Design", confidence: design}
    ue_class: crane_cpe
  S2_video:
    slice: vision
    qi: 84
    arp: {priority_level: 6, pre_emption_capability: "MAY_PREEMPT", pre_emption_vulnerability: "PREEMPTABLE"}
    gfbr_ul_mbps: {value: 20, unit: Mbit/s, source: "Computed: 5 cameras x 4 Mbit/s (services.yaml)", confidence: design}
    mfbr_ul_mbps: {value: 30, unit: Mbit/s, source: "Design", confidence: design}
    gfbr_dl_mbps: {value: 0.5, unit: Mbit/s, source: "Design: mission commands", confidence: design}
    mfbr_dl_mbps: {value: 2, unit: Mbit/s, source: "Design", confidence: design}
    ue_class: vehicle_cpe
  S2_telemetry:
    slice: vision
    qi: 83
    arp: {priority_level: 5, pre_emption_capability: "MAY_PREEMPT", pre_emption_vulnerability: "NOT_PREEMPTABLE"}
    gfbr_ul_mbps: {value: 0.5, unit: Mbit/s, source: "[UNVERIFIED] Derived from services.yaml telemetry_rate_mbps, itself unverified", confidence: unverified}
    mfbr_ul_mbps: {value: 1, unit: Mbit/s, source: "Design", confidence: design}
    gfbr_dl_mbps: {value: 0.5, unit: Mbit/s, source: "Design", confidence: design}
    mfbr_dl_mbps: {value: 1, unit: Mbit/s, source: "Design", confidence: design}
    ue_class: vehicle_cpe
  S3_reefer:
    slice: telemetry
    qi: 9
    arp: {priority_level: 12, pre_emption_capability: "SHALL_NOT_PREEMPT", pre_emption_vulnerability: "PREEMPTABLE"}
    gfbr_ul_mbps: {value: 0, unit: Mbit/s, source: "non-GBR", confidence: design}
    mfbr_ul_mbps: {value: 0.05, unit: Mbit/s, source: "Design (session-AMBR proxy)", confidence: design}
    gfbr_dl_mbps: {value: 0, unit: Mbit/s, source: "non-GBR", confidence: design}
    mfbr_dl_mbps: {value: 0.05, unit: Mbit/s, source: "Design", confidence: design}
    ue_class: reefer_iot
  S3_gate:
    slice: telemetry
    qi: 9
    arp: {priority_level: 10, pre_emption_capability: "SHALL_NOT_PREEMPT", pre_emption_vulnerability: "PREEMPTABLE"}
    gfbr_ul_mbps: {value: 0, unit: Mbit/s, source: "non-GBR", confidence: design}
    mfbr_ul_mbps: {value: 20, unit: Mbit/s, source: "Design: OCR burst", confidence: design}
    gfbr_dl_mbps: {value: 0, unit: Mbit/s, source: "non-GBR", confidence: design}
    mfbr_dl_mbps: {value: 5, unit: Mbit/s, source: "Design", confidence: design}
    ue_class: handheld
  S3_handheld:
    slice: telemetry
    qi: 9
    arp: {priority_level: 9, pre_emption_capability: "SHALL_NOT_PREEMPT", pre_emption_vulnerability: "PREEMPTABLE"}
    gfbr_ul_mbps: {value: 0, unit: Mbit/s, source: "non-GBR", confidence: design}
    mfbr_ul_mbps: {value: 2, unit: Mbit/s, source: "Design", confidence: design}
    gfbr_dl_mbps: {value: 0, unit: Mbit/s, source: "non-GBR", confidence: design}
    mfbr_dl_mbps: {value: 5, unit: Mbit/s, source: "Design", confidence: design}
    ue_class: handheld

# services.yaml — S1/S2/S3 traffic models and offered load.
# Offered load is COMPUTED by scenario.py from these primitives; never hard-code an aggregate.

S1_crane_control:
  description: "Remote STS crane control: UL camera feeds + DL control commands"
  n_devices:
    value: 11
    unit: cranes
    source: "Brief §1.1: 11 super post-Panamax STS cranes at BEST (verify: Hutchison Ports BEST terminal facts page)"
    confidence: secondary
  cameras_per_crane:
    value: 7
    unit: cameras
    source: "Brief §1.2 gives 6-8 camera feeds per crane; midpoint chosen (design). Verify against a remote-crane-operation vendor reference (e.g. 5G-ACIA / Port of Hamburg remote crane trials)."
    confidence: design
  ul_video_rate_per_crane_mbps:
    value: 40
    unit: Mbit/s
    source: "Brief §1.2 range 20-60 Mbit/s aggregate UL per crane; midpoint chosen (design). Sensitivity analysis sweeps 20-60."
    confidence: design
  ul_video_rate_range_mbps:
    value: [20, 60]
    unit: Mbit/s
    source: "Brief §1.2"
    confidence: secondary
  control_loop_rate_hz:
    value: 100
    unit: Hz
    source: "Brief §1.2: 50-100 Hz control loop; upper bound chosen for the latency budget (design)."
    confidence: design
  control_packet_bytes:
    value: 255
    unit: B
    source: "Matched to the MDBV of 5QI 82 (TS 23.501 Table 5.7.4-1) so a command fits in one burst"
    confidence: secondary
  activity_factor:
    value: 1.0
    unit: ""
    source: "Design: all cranes assumed simultaneously in remote mode (worst case, busy-hour)"
    confidence: design
  ue_class: crane_cpe
  zone: quay_apron
  one_way_latency_target_ms:
    value: 10
    unit: ms
    source: "TS 22.104 Table 5.2-1 'Remote control' / 'Mobile robots' class figures range from 1 ms to 50 ms; brief §3.4 maps crane control to 5QI 82/83 (PDB 10 ms). Exact TS 22.104 row still to be selected and quoted — see qos.yaml."
    confidence: secondary
  reliability_target:
    value: 0.99999
    unit: ""
    source: "Brief §4.4: 99.999% within the PDB (TS 22.104 uses 'communication service availability' 99.999% for several motion-control rows)"
    confidence: secondary
  area_availability_target:
    value: 0.999
    unit: ""
    source: "Brief §4.2: 99.9% area availability for the control slice"
    confidence: design


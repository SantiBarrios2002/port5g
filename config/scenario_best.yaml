simulation:
  seed:
    value: 20260915
    unit: ""
    source: "Design: master RNG seed (rule §10.4 — every stochastic component derives its seed from this)"
    confidence: design
  grid_resolution_m:
    value: 10
    unit: m
    source: "Design: SINR/coverage evaluation grid pitch"
    confidence: design
  admission:
    duration_s: {value: 600, unit: s, source: "Design: 10-minute load ramp for figure 8", confidence: design}
    dt_s: {value: 1.0, unit: s, source: "Design: time step", confidence: design}
    ramp_factor_max: {value: 3.0, unit: "", source: "Design: offered load ramps linearly from 0 to 3x nominal to force pre-emption", confidence: design}
    mean_holding_time_s:
      control: {value: 300, unit: s, source: "Design: long-lived crane sessions", confidence: design}
      vision: {value: 120, unit: s, source: "Design", confidence: design}
      telemetry: {value: 20, unit: s, source: "Design: short IoT sessions", confidence: design}

# economics.yaml — techno-economic model (report Ch. 5): site count -> CAPEX/OPEX -> cash flow, NPV, payback.
# Currency EUR, real terms (no inflation). Same record schema as every other config file.
#
# !! EVERY cost and saving below is an [UNVERIFIED] PLACEHOLDER chosen only so the pipeline runs. They are round
# !! orders of magnitude, NOT taken from any source. Figures 10-12 carry a red stamp while any of them remains.
# !! Each source field says where the team should look. Replace value + source + confidence together.
#
# The structure (what is counted, and that automation savings are netted against automation cost, not credited
# to the network alone) is the design argument; the numbers are the team's sourcing task.

model:
  horizon_years:
    value: 10
    unit: years
    source: "Design: typical depreciation life of RAN/core equipment; sweep in the report if challenged."
    confidence: design
  discount_rate:
    value: 0.08
    unit: "1/year"
    source: "Design: corporate hurdle rate used for the NPV. Replace by a cited port-operator WACC if one is found."
    confidence: design
  benefit_ramp:
    value: [0.3, 0.7, 1.0]
    unit: "fraction of full annual benefit, years 1..3 (1.0 afterwards)"
    source: "Design: phased roll-out (pilot crane/shuttles -> quay -> full yard). Must match the deployment-phases section of Ch. 4."
    confidence: design
  base_site_scenario:
    value: capacity_2layer
    unit: ""
    source: "Design: the report's reference network is the capacity-driven count with 2-layer UL MIMO (coverage-driven count does not carry the UL load, see impact_notes M10)."
    confidence: design
  sensitivity_fraction:
    value: 0.3
    unit: ""
    source: "Design: every economic input is perturbed by +/-30 % for the NPV tornado (fig. 12)."
    confidence: design


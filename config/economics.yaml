    source: "[UNVERIFIED] Placeholder. gNB (RU+DU/CU share) for one 100 MHz n77 4T4R site. Source from integrator/vendor list prices or a private-network cost study (e.g. Analysys Mason, Ofcom, 5G-ACIA)."
